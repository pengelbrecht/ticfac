name: CI

on:
  push:
    # epic/** as well as main, and the reason is not coverage. An epic's
    # close-out waits for check runs on its PR's head commit, and GitHub runs a
    # pull_request workflow only while the PR is MERGEABLE by GitHub's own
    # merge - which does not run tk's merge drivers. .tick/activity/
    # activity.jsonl is appended on both sides, merges cleanly through tk and
    # conflicts as plain text, so any epic whose run overlapped a tracker edit
    # on main showed as conflicting and never got CI: both epic PRs sat
    # 'closeout_ci_absent' for an hour on 2026-09-23. A push-triggered run
    # attaches its check runs to the same head commit the close-out reads
    # (commits/<sha>/check-runs), whatever GitHub thinks of the merge.
    branches: [main, "epic/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No dependency cache: this module is stdlib-only, so there is no
          # go.sum for setup-go to key a cache on. Turn this on in the same
          # commit as the first dependency.
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^contracts/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The full suite's one test that needs the OTHER toolchain:
      # internal/exec/cloudflaresandbox's end-to-end adoption test (tick 6gr)
      # drives the real factory Worker (cloudflare/src) in real workerd through
      # miniflare, so it skips itself wherever cloudflare/node_modules is not
      # installed. `make test` below is the one place that test runs, and a
      # suite whose newest end-to-end proof skips on every CI run is a suite
      # that never proved it, so the install lives here — the same two setup
      # actions and the same frozen install the typescript job runs, arriving
      # at the same cached store, before the step that needs it.
      #
      # It costs the install (~1 min cold, seconds cached) on a job that runs
      # ~7 minutes of Go tests; it is deliberately NOT on the `go test -short`
      # step's path, whose point is that the short suite needs nothing but Go.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare/pnpm-lock.yaml

      - name: Install the worker workspace
        working-directory: cloudflare
        run: pnpm install --frozen-lockfile --prefer-offline

      # -timeout is pinned via the Makefile (not a bare `go test ./...`):
      # internal/reconcile's suite runs 600-620s even under -short, past go
      # test's default 10-minute per-package timeout.
      - name: go test -short
        run: make test-short

      # The full suite, which additionally builds the binary and asserts the
      # exit code a shell sees for `ticfac run-epic <id>`.
      - name: go test
        run: make test

      - name: ticfac run-epic fails closed
        run: |
          go build -o /tmp/ticfac ./cmd/ticfac
          set +e
          out="$(/tmp/ticfac run-epic x 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "exit code $code, want 2"; exit 1
          fi
          case "$out" in
            *"no executor configured"*) ;;
            *) echo "the refusal does not say 'no executor configured'"; exit 1 ;;
          esac

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No dependency cache: this module is stdlib-only, so there is no
          # go.sum for setup-go to key a cache on. Turn this on in the same
          # commit as the first dependency.
          cache: false

      # The offline gate. It makes no network call, so no network failure can
      # turn this job green by skipping it: the vendored bundle is verified
      # against its own manifest and against contracts.pin.json's digests.
      - name: Verify the vendored bundle offline
        run: go run ./cmd/contracts check

      # The online half: fetch pengelbrecht/ticks at the PINNED REF and require
      # the vendored copy to be what ticks published there, byte for byte. This
      # is the step that makes "vendored" mean "pinned" rather than "copied".
      - name: Verify the vendored bundle against the pinned ticks ref
        run: go run ./cmd/contracts verify-upstream

      # Every reader for every file in the bundle. Named as its own step so a
      # contract problem is legible in the log instead of surfacing as one
      # failure among many inside `go test ./...`.
      - name: Run every contract reader
        run: go test ./internal/contracts/... ./internal/schema/... -v

      # The negative control, made visible. contracts/README.md's rule is that
      # a check nothing has ever seen fail is not known to be a check, so CI
      # breaks a vendored fixture on purpose and requires the check to refuse
      # it — then restores it and requires the check to pass again.
      - name: A deliberately broken vendored fixture fails
        run: |
          printf '\n' >> contracts/message-context.json
          if go run ./cmd/contracts check; then
            echo "FAIL: the check passed with an edited fixture — it is not a check"
            exit 1
          fi
          echo "refused, as it must be"
          git checkout -- contracts/message-context.json
          go run ./cmd/contracts check

  # image/ is the sandbox image's build context (moved there from cloud/sandbox
  # by SPEC §12 Phase 4 item 4) — ticks owns the tree (its internal/sandbox
  # suite runs those scripts from its own copy) and this repository vendors it
  # as the factory's embedded image context. Two repositories, one
  # tree: without this job nothing stops the copies drifting while ticks' tests
  # guard ITS copy and ticfac's cold-start budget bounds a container built from
  # THIS one. sandbox.pin.json is the pin; cmd/sandbox is the check.
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The version is named here rather than by a `packageManager` field in
      # cloudflare/package.json: adding that field makes pnpm record
      # packageManagerDependencies in the lockfile, so `--frozen-lockfile`
      # refuses until the lockfile is regenerated. This says the same thing
      # without rewriting the lockfile in a tick about gating.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare/pnpm-lock.yaml

      - name: Install
        working-directory: cloudflare
        run: pnpm install --frozen-lockfile

      # Biome (tick ncr). The go job already runs `gofmt -l` here even though
      # the Go gate does not, on the reasoning that main's copy must be the
      # formatted one whatever a tick host did; this is that reasoning applied
      # to the other language.
      #
      # Unlike vitest, this is NOT a case of CI taking what the gate cannot
      # afford - the gate runs `pnpm lint` too. It runs in both because the
      # gate is what a tick must pass and this is what main takes, and the two
      # are not the same claim: a tick can be amended, rebased or landed by a
      # route that never re-ran the gate. It costs ~1.5s in a job whose next
      # step is the 82s suite.
      - name: biome
        working-directory: cloudflare
        run: pnpm lint

      # The whole TypeScript suite, and the reason this job exists (tick odc).
      # Until it, NOTHING ran these tests - not the gate, not CI - and the cost
      # was tick b9w: the control plane sat pinned to contract bundle 3.0.0
      # against a 5.2.0 bundle, wrong about three record shapes, for two major
      # versions, silently.
      #
      # vitest is HERE and not in the per-tick gate because it is 82s against
      # the gate's other TypeScript checks at 3s, and gate commands run
      # serially: it would take every tick's gate from 3m26s to about 4m48s.
      # Here it runs beside the Go job, which is several times longer, so it
      # costs no wall clock at all.
      #
      # The split, stated so neither side can quietly claim the other's work:
      # the GATE covers contracts and types, THIS covers behaviour.
      - name: pnpm test
        working-directory: cloudflare
        run: pnpm test

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No dependency cache: this module is stdlib-only, so there is no
          # go.sum for setup-go to key a cache on. Turn this on in the same
          # commit as the first dependency.
          cache: false

      # The offline gate. It makes no network call, so no network failure can
      # turn this job green by skipping it: the vendored tree is verified
      # against sandbox.pin.json's digests and git modes. It also runs inside
      # `go test ./...` (internal/sandboxpin), so the gate and CI cannot
      # disagree silently.
      - name: Verify the vendored image context offline
        run: go run ./cmd/sandbox check

      # The online half: fetch pengelbrecht/ticks at the PINNED REF and
      # require the vendored tree to be what ticks published there, byte for
      # byte. This is the step that answers the drift question directly — the
      # copy here is not merely self-consistent, it is ticks' tree.
      - name: Verify the vendored image context against the pinned ticks ref
        run: go run ./cmd/sandbox verify-upstream

      # The negative control, made visible: break a vendored script on purpose
      # and require the check to refuse it — then restore it and require the
      # check to pass again. A check nothing has ever seen fail is not known to
      # be a check.
      - name: A deliberately broken vendored script fails
        run: |
          printf '\n' >> image/worker.sh
          if go run ./cmd/sandbox check; then
            echo "FAIL: the check passed with an edited vendored file — it is not a check"
            exit 1
          fi
          echo "refused, as it must be"
          git checkout -- image/worker.sh
          go run ./cmd/sandbox check
