name: CI

on:
  push:
    # epic/** as well as main, and the reason is not coverage. An epic's
    # close-out waits for check runs on its PR's head commit, and GitHub runs a
    # pull_request workflow only while the PR is MERGEABLE by GitHub's own
    # merge - which does not run tk's merge drivers. .tick/activity/
    # activity.jsonl is appended on both sides, merges cleanly through tk and
    # conflicts as plain text, so any epic whose run overlapped a tracker edit
    # on main showed as conflicting and never got CI: both epic PRs sat
    # 'closeout_ci_absent' for an hour on 2026-09-23. A push-triggered run
    # attaches its check runs to the same head commit the close-out reads
    # (commits/<sha>/check-runs), whatever GitHub thinks of the merge.
    branches: [main, "epic/**"]
    # A run's own durable records (.ticfac/: checkpoints, attempt records,
    # evidence) are pushed to the epic branch several times a minute. With
    # cancel-in-progress below, every such push cancelled the CI run on the
    # code before it and started another: epic/gvc's close-out on 2026-09-26
    # saw a dozen cancelled runs in one hour. Those commits carry no code, and
    # the close-out already accepts "CI green on the newest commit it ran on,
    # with only .ticfac/ changes since" (closeout.go). .tick/ is NOT ignored:
    # the close-out's own tracker commits must get CI on their head.
    paths-ignore:
      - ".ticfac/**"
  pull_request:
    paths-ignore:
      - ".ticfac/**"
  # The run starts CI itself when the code an epic PR would merge has no run
  # at all — its push's run cancelled while still queued, and every push since
  # changed only .ticfac/ (internal/reconcile/closeout_ci.go, dispatchSilentCI).
  # Without this trigger that code would never get a verdict to wait for.
  workflow_dispatch:

permissions:
  contents: read

# Main's runs are never cancelled by a later push: main's full run is the
# deploy gate, and when merges landed faster than the 13-minute suite every
# main run was cancelled by the next and nothing deployed (1d628236 ran 14
# minutes and was cancelled, 2026-10-01). GitHub keeps one run in progress and
# one pending per group, a newer pending replacing an older, so main still
# converges on its newest head. Every other ref cancels as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Two shapes of run (operator, 2026-10-01: "only a few CIs at critical
# junctures"):
#
#   - push (main, epic/**) and workflow_dispatch: the FULL suite, sharded —
#     internal/reconcile (11 of the old job's 13 minutes) split across three
#     `go test` jobs, every other package in a fourth. Main's full run is the
#     deploy gate: deploy-factory.yml runs on this workflow's success. An epic
#     branch's full run is what its close-out waits for.
#   - pull_request: ADVISORY and affected-only. The plan job runs the Go
#     packages the diff can change the verdict of (changed packages and every
#     package whose tests depend on one), skips the Go jobs when there are
#     none and typescript when nothing it reads changed. Agents merge on local
#     targeted tests and `make gate`; nothing here is a required check.
#
# The plan is .github/scripts/ci-plan.sh; a shard is go-test-shard.sh.
jobs:
  plan:
    name: plan
    # An epic branch already gets a push-triggered run on the same head
    # commit (see `on:` above), so its PR's pull_request run was the same
    # checks twice; skipping the plan skips every job that needs it.
    # Feature-branch PRs still run here: their branches are not in the push
    # filter.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'epic/')
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      go: ${{ steps.plan.outputs.go }}
      ts: ${{ steps.plan.outputs.ts }}
      race_pkgs: ${{ steps.plan.outputs.race_pkgs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A pull request's diff is taken against its base, which a shallow
          # checkout of the merge commit does not carry.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE"...HEAD | .github/scripts/ci-plan.sh
          else
            .github/scripts/ci-plan.sh </dev/null
          fi

  go-lint:
    name: go lint
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Cached on go.sum: the module cache and, more importantly, the
          # build and test cache, so an unchanged package's tests answer from
          # cache exactly as they do on a laptop and in the per-tick gate.
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^contracts/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: ticfac run-epic fails closed
        run: |
          go build -o /tmp/ticfac ./cmd/ticfac
          set +e
          out="$(/tmp/ticfac run-epic x 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "exit code $code, want 2"; exit 1
          fi
          case "$out" in
            *"no executor configured"*) ;;
            *) echo "the refusal does not say 'no executor configured'"; exit 1 ;;
          esac

  # The suite, one job per entry of the plan's matrix: internal/reconcile's
  # three shards (its top-level tests dealt round-robin by name, so the shards
  # partition the package by construction) and one job for every other
  # package. -timeout and -parallel stay the Makefile's: each shard is a
  # `make test` narrowed by PKGS and GOTEST_RUN.
  #
  # This is also where the sandbox image's scripts are tested (tick r6w):
  # internal/sandboximage runs image/'s entrypoints for real against stub
  # harnesses and real git, from the tree the binary embeds.
  go-test:
    name: go test (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Cached on go.sum: the module cache and, more importantly, the
          # build and test cache, so an unchanged package's tests answer from
          # cache exactly as they do on a laptop and in the per-tick gate.
          cache: true

      # The one test that needs the OTHER toolchain:
      # internal/exec/cloudflaresandbox's end-to-end adoption test (tick 6gr)
      # drives the real factory Worker (cloudflare/src) in real workerd through
      # miniflare, so it skips itself wherever cloudflare/node_modules is not
      # installed. A suite whose newest end-to-end proof skips on every CI run
      # never proved it, so the job that runs that package installs the worker
      # workspace first (the plan sets `node` on it).
      - uses: pnpm/action-setup@v4
        if: matrix.node
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        if: matrix.node
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare/pnpm-lock.yaml

      - name: Install the worker workspace
        if: matrix.node
        working-directory: cloudflare
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: go test
        run: .github/scripts/go-test-shard.sh "${{ matrix.pkgs }}" "${{ matrix.shard }}" "${{ matrix.of }}"

  # The race detector over the short suite, as its own job so it runs beside
  # the tests and adds no wall time to CI (measured locally, 10-core darwin:
  # the short suite 64s plain, 81s under -race). The short suite is where
  # every concurrent seam is exercised — the follow, the watch, the detached
  # attach, the overview's gathering. A race is a bug, production or test
  # side: this job stops one landing. A pull request races its affected
  # packages only.
  go-race:
    name: go race
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race -short
        run: make test-race PKGS="${{ needs.plan.outputs.race_pkgs }}"

  # One check named `go` over every Go job, whatever the matrix was: a reader
  # (a person, the close-out's per-check view) keeps one name to look at.
  # Skipped Go jobs (a pull request with no Go change) read as a pass; a
  # failed or cancelled one fails it. deploy-factory.yml reads the WORKFLOW's
  # conclusion, which every job's failure already decides.
  go:
    name: go
    needs: [plan, go-lint, go-test, go-race]
    if: always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'epic/'))
    runs-on: ubuntu-24.04
    steps:
      - name: Every Go job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')"
          if [ -n "$bad" ]; then
            echo "not passed: $bad"
            exit 1
          fi

  contracts:
    name: contracts
    # An epic branch already gets a push-triggered run on the same head
    # commit (see `on:` above), so its PR's pull_request run was the same
    # checks twice. Feature-branch PRs still run here: their branches are not
    # in the push filter.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'epic/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Cached on go.sum: the module cache and, more importantly, the
          # build and test cache, so an unchanged package's tests answer from
          # cache exactly as they do on a laptop and in the per-tick gate.
          cache: true

      # The offline gate. It makes no network call, so no network failure can
      # turn this job green by skipping it: ticfac's authored bundle verifies
      # against its own manifest, and the two ticks-owned files verify against
      # contracts.pin.json's digests too.
      - name: Verify the contract bundle offline
        run: go run ./cmd/contracts check

      # The online half, for the two files that still have an upstream: fetch
      # pengelbrecht/ticks at the PINNED REF, bind the pin's digests to ticks'
      # own bundle manifest for that version, and require the vendored bytes to
      # be what ticks published there, byte for byte. This is the step that
      # makes "vendored" mean "pinned" rather than "copied".
      - name: Verify the ticks-owned contracts against the pinned ticks ref
        run: go run ./cmd/contracts verify-upstream

      # Every reader for every file in the bundle. Named as its own step so a
      # contract problem is legible in the log instead of surfacing as one
      # failure among many inside `go test ./...`.
      - name: Run every contract reader
        run: go test ./internal/contracts/... ./internal/schema/... -v

      # The negative control, made visible. contracts/README.md's rule is that
      # a check nothing has ever seen fail is not known to be a check, so CI
      # breaks a bundle fixture on purpose and requires the check to refuse it
      # — then restores it and requires the check to pass again.
      - name: A deliberately broken fixture fails
        run: |
          printf '\n' >> contracts/message-context.json
          if go run ./cmd/contracts check; then
            echo "FAIL: the check passed with an edited fixture — it is not a check"
            exit 1
          fi
          echo "refused, as it must be"
          git checkout -- contracts/message-context.json
          go run ./cmd/contracts check

  typescript:
    name: typescript
    # Always on a push or dispatch; on a pull request only when the diff
    # touches what it reads (cloudflare/, contracts/, harness/, CI itself) —
    # the plan job decides, and an epic PR skips it with the plan.
    needs: plan
    if: needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # The version is named here rather than by a `packageManager` field in
      # cloudflare/package.json: adding that field makes pnpm record
      # packageManagerDependencies in the lockfile, so `--frozen-lockfile`
      # refuses until the lockfile is regenerated. This says the same thing
      # without rewriting the lockfile in a tick about gating.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Both lockfiles: cloudflare's (the factory) and harness/'s (the
          # pi-durable package), so a change to either's dependencies
          # invalidates the pnpm store cache.
          cache-dependency-path: |-
            cloudflare/pnpm-lock.yaml
            harness/pnpm-lock.yaml

      - name: Install
        working-directory: cloudflare
        run: pnpm install --frozen-lockfile

      # Biome (tick ncr). The go job already runs `gofmt -l` here even though
      # the Go gate does not, on the reasoning that main's copy must be the
      # formatted one whatever a tick host did; this is that reasoning applied
      # to the other language.
      #
      # Unlike vitest, this is NOT a case of CI taking what the gate cannot
      # afford - the gate runs `pnpm lint` too. It runs in both because the
      # gate is what a tick must pass and this is what main takes, and the two
      # are not the same claim: a tick can be amended, rebased or landed by a
      # route that never re-ran the gate. It costs ~1.5s in a job whose next
      # step is the 82s suite.
      - name: biome
        working-directory: cloudflare
        run: pnpm lint

      # The whole TypeScript suite, and the reason this job exists (tick odc).
      # Until it, NOTHING ran these tests - not the gate, not CI - and the cost
      # was tick b9w: the control plane sat pinned to contract bundle 3.0.0
      # against a 5.2.0 bundle, wrong about three record shapes, for two major
      # versions, silently.
      #
      # vitest is HERE and not in the per-tick gate because it is 82s against
      # the gate's other TypeScript checks at 3s, and gate commands run
      # serially: it would take every tick's gate from 3m26s to about 4m48s.
      # Here it runs beside the Go job, which is several times longer, so it
      # costs no wall clock at all.
      #
      # The split, stated so neither side can quietly claim the other's work:
      # the GATE covers contracts and types, THIS covers behaviour.
      - name: pnpm test
        working-directory: cloudflare
        run: pnpm test

      # The pi-durable harness package's own suites (tick 92k, epic 43y step
      # 1): pi-durable's storage conformance cases against the DO SQLite
      # adapter, and the faux-provider transcript replay test. This is the
      # API-churn tripwire the spike asked for: the pinned packages say "the
      # API changes without notice", and when one moves, THIS fails CI
      # instead of a run. Lint and types first, exactly like the factory
      # side's steps above: a behavioural suite that cannot typecheck has
      # failed for a reason the log should name.
      #
      # ~9s measured locally (4s of it importing the worker bundle into
      # workerd), beside a Go job several times longer: no wall clock.
      - name: harness conformance and replay
        working-directory: harness
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test

  # The release recipe, verified before a tag is the only thing that can
  # discover it is broken (tick 4yb). goreleaser check validates
  # .goreleaser.yaml against the real schema — the builds, the archive
  # naming, the checksums, the release target — on every push and PR, so the
  # config that cuts tagged releases cannot rot silently between releases.
  # The behavioral half lives in the go job: internal/release's tests run
  # install.sh against a fake forge serving the binaries the config builds.
  release-config:
    name: release config
    # An epic branch already gets a push-triggered run on the same head
    # commit (see `on:` above), so its PR's pull_request run was the same
    # checks twice. Feature-branch PRs still run here: their branches are not
    # in the push filter.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'epic/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
