# Worker routing for herd-substrate epic runs. Schema and semantics: the ticks
# skill's references/runners-config.md.
version = 2

[orchestration]
substrate = "auto"
max_parallel = 4

[roles.implement]
# Operator routing for Phase 2 (2026-09-10). Implementation runs entirely on
# GLM on cloudflare through pi: GLM 5.3 for complex work (the default, and the
# `strong` tier) and GLM 5.3-flash for simple work (`economy`). opus is NOT an
# implementation tier — it is the claude harness only, reserved for review and
# closeout, and it is not available in pi at all.
#
# `pi` is the pi-durable harness (epic 43y, tick hpk; the pi CLI is deleted,
# tick jhp): headless through the local-subprocess executor or hosted in a
# cloud container. No `args`: neither launch reads roles-table args — that
# key reaches an argv only through the herdr pane path (spawnArgv), and herdr
# refuses kind pi — so tick 2p3 dropped the `--approve` the deleted pi CLI
# used to take for project-local file trust (tick gjk). ticfac init's writers
# emit the same shape, and internal/cli's TestAPiCellIsWrittenWithoutArgs
# pins them.
kind = "pi"
model = "cloudflare-workers-ai/@cf/zai-org/glm-5.3"
effort = "high"

# Simple work: mechanical, compiler-guided, low judgement.
[roles.implement.tiers.economy]
model = "cloudflare-workers-ai/@cf/zai-org/glm-5.3-flash"
effort = "medium"

# Complex work, named explicitly. Same model as the default: GLM 5.3 IS the
# strong tier for this epic. opus is not an implementation tier at all — it is
# reserved for review and closeout, and it is not available in the pi harness.
[roles.implement.tiers.strong]
model = "cloudflare-workers-ai/@cf/zai-org/glm-5.3"
effort = "high"

# `balanced` is NOT declared for implement, deliberately (epic 43y, tick
# 7ml): until 2026-10-05 this cell named kind = "codex" (a Phase-2
# leftover), and because runners.local.toml declares no [roles.implement]
# role cell to overlay it away, a local run pinning --tier balanced
# dispatched an implement worker on the codex CLI — a worker harness that is
# neither pi-durable nor the claude-CLI frontier rung the operator's
# 2026-10-04 decision keeps. No ladder ever derives balanced (the local
# ladder climbs strong -> frontier, the cloud's economy -> strong), and in
# the cloud this cell never reached a container anyway (the cloud's own role
# cell applied last). With the cell gone, a pin of balanced is REFUSED
# naming the tier — the profile layer's fail-closed rule (a tier that
# silently falls back to the role is a tier an operator paid for and did not
# get) — and internal/reconcile's routing guard resolves every tier name
# a pin can reach on every substrate, so a cell like the old one cannot come
# back unnoticed.

# The frontier-tier review at epic completion — and, with [roles.closeout]
# below, the deliberate LOCAL claude exception the operator blessed
# (2026-10-04/05 decisions; tick j6o): local final reviews and close-outs
# run on the claude CLI on purpose — the hn6 run was moved to a local run
# for exactly that — so these cells name claude opus and
# runners.local.toml deliberately declares no review or closeout cell to
# overlay them away. The claude CLI is otherwise the local FRONTIER rung
# only: implementation runs on pi-durable at base and every tier but
# frontier, and the cloud overlays every cell here away
# (runners.cloud.toml applies last; nothing in the cloud runs claude).
# TestThisRepositorysLocalClaudeRoutingIsExactlyTheBlessedCells holds this
# table: claude exactly here and on implement's frontier rung, pi or a
# named refusal everywhere else, on every local substrate.
[roles.review]
kind = "claude"
model = "opus"
effort = "high"

# The ceiling-tier overlay of the review cell (tick 2p6): the resolve-conflict
# job — dispatched when two same-wave attempts meet a content or add/add
# conflict — routes at the policy's ceiling through the REVIEW cell's
# candidates (a dedicated [roles.resolve-conflict] cell would always win),
# and locally the ceiling is the frontier tier of .tick/runners.local.toml's
# ladder. Without this cell the overlay the ceiling asks for is refused, and
# a refused routing is a resolve that stops the run over config — which is
# why a run now refuses at START when it cannot route (reconcile.CheckRouting).
# The cloud merges this cell, but can never run it: runners.cloud.toml's
# review cell applies last and routes the job to a Workers AI model, and the
# cloud must declare its OWN ceiling's tier there (its ceiling is strong, not
# frontier). Nothing in the cloud runs claude.
[roles.review.tiers.frontier]
kind = "claude"
model = "opus"
effort = "high"

# Closeout shares the review cell's blessing (see [roles.review] above):
# the operator wants local close-outs on claude opus too — the same
# 2026-10-05 decision, recorded on tick j6o — and the cloud overlays this
# cell away exactly as it overlays review's. A local override that moves
# either cell off the claude CLI is a change to an operator decision, not
# a config edit: take it to the operator.
[roles.closeout]
kind = "claude"
model = "opus"
effort = "high"

# Findings a worker routes to ANOTHER repository (a `target` other than this
# one). This run cannot fix another repository, so such a finding never gates
# this epic; the run disposes of it with nobody triaging. A target listed here
# with `file = true` is filed by the run as a tick in that repository's own
# tracker, pushed to its default branch; any other target — or a filing that
# fails terminally — becomes a backlog tick HERE that names the target. The
# epic-2jn close-out held on five findings for pengelbrecht/ticks (2026-09-27)
# because neither path existed. The operator owns both repositories.
[findings.route."pengelbrecht/ticks"]
file = true

# The cloud's routing lives in .tick/runners.cloud.toml and a laptop's
# extras (the claude ladder) in .tick/runners.local.toml (tick 5uo): each
# merges over this file for its own world, and its role cells apply LAST, so
# nothing written here for a tier can reach a container.

[testing.commands]
# Spelled out, not `make gate`: this file is what says what the gate runs, and a
# reader must be able to see it here. The Makefile's `gate` target carries the
# same line for humans and CI, and a test fails if the two ever disagree — the
# gate had drifted to a bare `go test -short -count=1 ./...`, losing the timeout
# and the parallelism that keep internal/reconcile inside go's per-package
# limit, and nothing noticed.
#
# 2026-09-18 — the `-count=1` is dropped, deliberately, by the operator.
#
# It disabled Go's test cache, so every package was re-run for every tick even
# when nothing it depends on had changed. Epic 9pd ran this gate 49 times at
# roughly 20 minutes idle and 45-60+ under load, and finished with three ticks
# whose code was already merged facing three sequential full runs.
#
# The suite still runs in full. What changes is that a package whose inputs are
# unchanged answers from cache, which is a true statement about this tree: Go
# keys the cache on the package's sources, its dependencies, and the files and
# environment the test consulted.
#
# 2026-09-20 — and until tick 6wh it bought NOTHING, because the gate ran in a
# fresh temp directory every time and Go's cache keys on the absolute paths a
# test opened. The reasoning above was right and the mechanism was broken. 6wh
# runs the gate in a stable directory per repository, so the saving described
# here is now a thing that actually happens.
#
# The exposure that came with it, and the answer. A test that reads a file by an
# ABSOLUTE path OUTSIDE the module can be served from cache after that file
# changes. contracts.RepoRoot() builds absolute paths, so the drift guards that
# read this very file — TestThisRepositorysGateIsReadable,
# TestTheGateTargetMatchesTheDeclaredGate,
# TestTheHarnessBoundOutlivesEveryDeclaredGateBound — were the ones to watch.
# They are safe: this file is INSIDE the module those tests belong to, and go
# invalidates on it. Demonstrated by hand (edit the command on the line below
# and the guard fails, uncached) and on every run by
# TestACachedPassCannotHideAnEditToAFileAGuardReads, which rebuilds the guards'
# exact shape in a throwaway module and edits its input under it. `make suite`
# keeps -count=1 and remains the paranoid answer; it is no longer a required
# one. The wider audit is still tick mbv's.
#
# 2026-09-20 — the `-short` in this line now MEANS something (tick miu). It
# used to mean nothing: 6 of 215 test files consulted testing.Short(), so every
# per-tick gate ran the entire end-to-end suite — 23 minutes on the e9n
# attempt-8 run, which then failed on two tests (e4u, 7c0) that pass on a quiet
# host and stopped the Phase 5 run for nothing.
#
# internal/reconcile, internal/exec/herdr and internal/runstate now skip under
# -short at their harness constructors, and this command runs in seconds. What
# it no longer covers is exactly what CI covers: ci.yml's go job runs
# `make test-short` AND `make test`, so nothing this gate skips reaches main
# unrefused. internal/shorttest holds the guard that stops a new test from
# quietly re-entering — or quietly escaping — the short suite.
#
# The command itself is UNCHANGED, and must stay byte-identical to the
# Makefile's `gate` recipe: TestTheGateTargetMatchesTheDeclaredGate compares
# the two.
# gofmt and go vet first, exactly as CI's go job runs them: the gate is what a
# worker's commit must pass, and a gate weaker than CI lets a tick close on a
# tree CI then fails. An xte worker's unformatted test file did exactly that on
# 2026-09-23 - gate green, epic PR red - and the close-out held on it.
# `(! grep .)` prints any unformatted file and fails if there was one; it is
# written without $ so the Makefile's gate target can carry the same line.
#
# 2026-10-08 - the go test half runs under a STRIPPED GIT ENVIRONMENT (tick
# pqs): no global or system config file, and user.useConfigOnly refusing the
# implicit identity fallback. That is CI's machine, reproduced on a laptop: a
# fixture that commits with no identity of its own - relying on the developer's
# global git identity - passed every local gate and failed CI with exit 128
# (tick lkd, 2026-09-24), and a gate that cannot see the condition cannot catch
# the next one. It is GIT's environment and not HOME=<empty> (the original
# reproduction's recipe) on purpose: the go toolchain needs HOME for its build
# cache, the run's own gate builds carry HOME by contract
# (TestAGateDoesNotInheritTheRunsControlPlane), and the property library
# resolves a user cache dir at init. The two /dev/null config files give git
# exactly what an absent HOME gave it - no global config, no system config -
# and useConfigOnly keeps the identity half honest.
go = { command = "gofmt -l . | grep -v '^contracts/' | (! grep .) && go vet ./... && env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=user.useConfigOnly GIT_CONFIG_VALUE_0=true go test -short -timeout 45m -parallel 12 ./...", description = "Go: gofmt, vet and tests, as CI runs them" }

# The touched half of the Go gate (tick r1f): the FULL — non-short — test
# suites of the Go packages whose files the gated tick changed, plus every
# package whose code or TESTS import them, transitively. The selection and
# the rule live in internal/gatescope (cmd/gate-touched is the thin command);
# the import graph is one `go list` invocation, so the reverse closure is as
# cheap as the tick asked it to be.
#
# Why this is declared here and not built into the reconciler: the reconciler
# is repo-neutral — it cannot know that a repository has Go packages at all.
# What it exports is neutral and is this check's whole input: the two commits
# whose three-dot diff is the tick's own change, TICFAC_GATE_TOUCHED_BASE
# and TICFAC_GATE_TOUCHED_HEAD, both always present, empty when this gate
# has no such diff (the close-out's fold, whose full suite is the CI the
# close-out already waits for on the PR head). What a repository does with
# that pair is the repository's own declaration, which is what this table
# is. Run by a person with no gate above it, the command diffs the working
# branch against origin/main — the same question for the tree a person is
# about to push.
#
# What it is for: dz1's regression — a pinned-version change broke four
# internal/reconcile end-to-end tests, the short suite skipped every one of
# them, and the break surfaced at the epic's close-out in CI's full suite,
# costing a repair and two ~30-minute CI cycles. The packages a tick's diff
# reaches are exactly the ones whose behaviour that tick changed, and the
# reverse-dep edge is the one dz1 rode in on: the tick touched internal/tk,
# the tests that broke lived in internal/reconcile, which imports it.
#
# THE BOUND, decided and justified (the tick asked for one): per-package
# budgets, plus the cap that already exists.
#   - go test's own -timeout, 45m, PER PACKAGE BINARY — the whole-repo
#     suite's number, for the Makefile's own stated reason: a loaded or
#     slower host must fail on its own merits, never on go's 10m default.
#   - The check's outer cap is the gate's existing harness bound (60m), the
#     same one that bounds every declared check — a second, smaller clock
#     here would refuse exactly the slow-but-honest suites cy2 spent this
#     epic defending.
#   - What bounds the WORK is the selection, and the budget is -leave-to-ci.
#     THE ONE NAME ON THAT LIST IS internal/reconcile, and the number is
#     why, measured on this host (10-core darwin/arm64, load ~3.5 with
#     other runs live, under nice): internal/reconcile's full suite alone
#     ran 41m28s at the gate's own -parallel 12, and the whole 23-package
#     closure of this very tick 43m39s — against the short half of the
#     same gate at 1m33s. Most ticks reach reconcile through one import or
#     another (forge, tk, runstate, gitbin, subprocess), so paying it per
#     tick would put ~40 minutes on most of the dozens of gates an epic
#     runs (49 on epic-9pd) and invert this epic's own reason for existing.
#     reconcile's full suite therefore stays where it already runs — CI's
#     three sharded go-test jobs, which the close-out waits on — and every
#     gate names it as left to CI in its own evidence rather than skipping
#     it silently. The price of that decision is stated plainly: a
#     dz1-shaped break IN internal/reconcile itself rides to the close-out
#     exactly as dz1 did; what the gate keeps per tick for it is the short
#     suite and the full suites of every importer — cli, factory, herdr,
#     statusmodel, runlife — which is where a tick's reach is observable
#     anyway. When this epic's [A1] halves the full suite and x73 lands,
#     delete the name below and the gate pays.
#   - Without -count=1, deliberately: a package among the selection whose
#     inputs did not change answers from go's own test cache, which the mbv
#     audit demonstrated is a true statement about this tree. That is what
#     keeps a repair's re-gate from paying for the whole selection twice.
go-touched = { command = "go run ./cmd/gate-touched -timeout 45m -parallel 12 -leave-to-ci github.com/pengelbrecht/ticfac/internal/reconcile", description = "Go: the full (non-short) suites of the packages this tick touched, and of the packages that import them" }

# The TypeScript half, added by tick odc. Until it, NOTHING ran cloud/factory's
# tests — not this gate, not CI — and the cost of that silence was tick b9w: the
# control plane sat pinned to contract bundle 3.0.0 against a 5.2.0 bundle,
# wrong about three record shapes, for two major versions.
#
# vitest is IN this command now (tick tc9). Until it, the gate took the two
# cheap checks and CI took behaviour — a split odc measured into being: gate
# commands run SERIALLY, and 82s of vitest against ~3s of checks was a real
# cost. The split was also a hole, and the hole had a shape: mn7's worker ran
# cloud/factory's suite, the gate never did, so a TypeScript behaviour change
# could settle a tick with no gate ever running its tests (yoh's final-review
# finding dfae216d, filed as tc9). A gate that does not run the behaviour
# suite is not a gate on the code a tick changed; it is a gate on the shape
# of that code.
#
# The condition tc9 set for the move — deterministic under load — is met: both
# known flakes are fixed (3cq's leaked Workflow booting containers into the
# next test's sandboxes, #43; the refused publish-slot release, eg9, #21), and
# what keeps the suite deterministic lives in cloudflare/vitest.config.ts —
# files run serially (fileParallelism stays off: parallel failed one run in
# five on exactly this host) and every test and hook is bounded at 30s.
#
# The cost, measured on this host on 2026-10-07 with the machine at load ~5
# (other runs' workers): 1864 tests in 80 files, green five times running —
# three standalone `vitest run` at 208s, 233s and 353s, then this whole
# command twice at 309s and 310s. The command declares no timeout of its
# own — vitest has no global bound, and its per-test bounds are set in the
# config — so the harness bound (60m) is the outer one, and the worst
# observed run is a tenth of it. The ts command goes from ~6s to about
# 3.5-6m; against the Go half's ~3m on this host the TypeScript half now
# carries the gate's longer leg — the price of behaviour being gated per
# tick rather than on the epic PR alone.
#
# The spelling is `vitest run`, the exit-when-done form: bare `vitest` is watch
# mode, and a gate command that never exits is a gate that holds its harness
# bound open for the full hour on every tick while refusing nothing.
#
# contracts:check is the one that earned its place before all this: it is the
# check that would have caught b9w's drift the day it happened, and it costs a
# second.
#
# `pnpm lint` is Biome (tick ncr) — this side's gofmt AND its vet, in one Rust
# binary. It is IN this command rather than a sibling [testing.commands] entry
# for one measured reason: a sibling would repeat `pnpm install`, which is ~0.7s
# on a warm store, to learn nothing the &&-chain's own output does not already
# name. The cost, re-measured 2026-10-07 (attempt 10 of ncr) with the tree at
# 167 files rather than the 109 the first measurement saw: `pnpm lint` is
# 3.19/2.89/2.32s wall over three runs (Biome's own line: "Checked 167 files in
# 1.3s"), so the gate's TypeScript half goes from ~3s to ~6s and the whole gate
# stays unmoved against the 3m26s Go side.
#
# `pnpm lint` is `biome ci --error-on-warnings`, and the flag matters: plain
# `biome ci` exits 0 with warnings still on the floor, and most of what Biome
# found here — the unused variable, the implicit anys — is warning severity, so
# without it this half cannot refuse what it was added to catch.
#
# `pnpm lint:test` is that claim made executable — ncr's acceptance says the
# format check and the lint check must both FAIL on a deliberately bad file,
# and until it the proof was a probe a worker ran by hand ("it was also checked
# that it CAN fire"), evidence that left with the terminal it ran in. It breaks
# five throwaway trees, each a copy of biome.jsonc and one deliberately bad
# file, against the real binary: a clean control, a mis-formatted module, a
# floating promise (the nursery rule the config names by hand, so the case also
# proves the config — not a fallback — is in force), the warning-severity probe
# that plain `biome ci` passes and the flag refuses, and a file the config's
# includes never named. 1.00/1.04/1.00s over three runs, beside the 2-3s the
# lint itself costs.
#
# Biome itself is still shape, not behaviour: it reads one file at a time. The
# behaviour half of this command is vitest, which is why it is here.
#
# What still rides with CI alone: the two node --test suites around the
# scripts themselves (contracts:test, operator-strings — sub-second each,
# run by ci.yml's `pnpm test`). The gate takes the behaviour suite the
# finding was about, not every check that touches cloudflare/. lint:test is
# the one exception, and it is in both deliberately: it is not a suite around
# the scripts, it is the acceptance evidence for `pnpm lint` itself, which
# the gate cannot run without.
#
# The two-layout fallback is GONE (tick 9a8). It existed only while Phase 4's
# l9n moved cloud/factory to cloudflare/: this command is read from the RUN'S
# checkout while it runs against the MERGED tree (defect 19q), so across the
# move the two disagreed and l9n could never have passed the gate whose job it
# was to move. Phase 4 merged to main on 2026-09-19 and neither cloud/factory
# nor cloud/sandbox exists any more, so the fallback arm named nothing.
ts = { command = "cd cloudflare && pnpm install --frozen-lockfile --prefer-offline && pnpm lint && pnpm lint:test && pnpm contracts:check && pnpm exec tsc --noEmit && pnpm exec vitest run", description = "TypeScript format, lint, lint refusals, contracts, types and tests" }

[environment.commands]
which-go = { command = "which go", description = "Go toolchain on PATH" }
git-config-user-email = { command = "git config user.email", description = "git identity configured" }
