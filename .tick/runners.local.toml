# Overrides for runs on THIS machine — herdr and harness substrates (tick
# 5uo): merged over .tick/runners.toml. The cloud never reads this file.
#
# The operator, 2026-09-23: "if a tick is complex you can consider using a
# claude executor locally. It should be significantly stronger than pi/glm" —
# local claude bills to the operator's Max subscription. So a local run's
# implement ladder starts on GLM 5.3 and climbs to claude after one failed
# attempt: attempt 1 -> strong (pi on glm-5.3), after a failure -> frontier
# (claude opus), capped there.
version = 2

[roles.implement.tiers.frontier]
kind = "claude"
model = "opus"
effort = "high"
args = []

[tier_policy]
default = "strong"
ceiling = "frontier"
step = 1
# Jev starts the work that needs it on the dear rung (tick ms9). An
# implementation tick whose recorded classification puts more than
# mass_threshold of probability on design + diagnosis starts at frontier
# (claude opus) instead of burning an attempt on GLM first; everything else,
# and every tick Jev could not classify, starts at strong as before. Role
# jobs (review, closeout, repair, resolve) are never classified.
#
# 0.75 was measured on history, not guessed (tick ms9's notes carry the
# table): 96 implement ticks of 9pd/dha/ncv/2jn/6in with known outcomes,
# classified by the production client. Of the 10 that failed on the work
# (wall-clock or stuck kill, rejected, escalated) the rule catches the same
# 3 at every threshold from 0.15 to 0.84 (19l, 9fc, k7p: design at >= 0.84)
# and misses the same 7 (big construction ticks such as 46x and dz1, dear
# mass <= 0.14). So the threshold only sets how many ticks start dear, and
# 0.75 is the fewest (22 of 96) that still holds every catch with margin
# for Jev's measured run-to-run drift (max 0.09). The mass does NOT predict
# long or failing construction work: size is what makes those hard.
dear_work_types = ["design", "diagnosis"]
dear_tier = "frontier"
mass_threshold = 0.75
