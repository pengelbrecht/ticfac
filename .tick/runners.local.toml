# Overrides for runs on THIS machine — herdr and harness substrates (tick
# 5uo): merged over .tick/runners.toml. The cloud never reads this file.
#
# The operator, 2026-09-23: "if a tick is complex you can consider using a
# claude executor locally. It should be significantly stronger than pi/glm" —
# local claude bills to the operator's Max subscription. So a local run's
# implement ladder starts on GLM 5.3 and climbs to claude after one failed
# attempt: attempt 1 -> strong (pi on glm-5.3), after a failure -> frontier
# (claude opus), capped there.
version = 2

[roles.implement.tiers.frontier]
kind = "claude"
model = "opus"
effort = "high"
args = []

[tier_policy]
default = "strong"
ceiling = "frontier"
step = 1
# No tick starts on the classifier (operator decision 2026-10-04): every
# implementation tick starts at strong (GLM 5.3) and climbs to frontier
# (claude opus) after a failed attempt. The dear-mass rule tick ms9 set here
# (dear_work_types = design + diagnosis, dear_tier = frontier,
# mass_threshold = 0.75) is switched off. ms9's own history table already
# showed the mass caught 3 of 10 work failures at every threshold and missed
# the big construction ticks; docs/classifier-eval-2026-10-04-jev-clef.md
# (tick r3y, PR #206) then measured dear mass against outcomes at AUC
# 0.37-0.42 for Jev, Clef and Clef-flash — no model makes the rule
# predictive. Classification still runs and is recorded on the run branch,
# as data for a later question (size/effort, or fine-tuning on outcomes).
# `ticfac status` reports the escalation rate the ladder now carries alone.
