# The STAGING Worker (epic umq, tick nmd): FactorySandbox alone, under its own
# Worker name AND its own container application name, so a deploy can be
# rehearsed under a live container without touching the production factory.
# `wrangler deploy --name` does not rename container applications, which is
# why this is a file of its own rather than a flag. Routes: src/staging.ts.
name = "ticks-factory-staging"
main = "../src/staging.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "SANDBOXES_V1"
class_name = "FactorySandbox"

# claude-sub (spike tick jvj, src/claude-sub.ts): the one pool of claude
# subscriptions — leases (the per-subscription cap) and quota benches. The
# tokens are secrets, one per subscription: CLAUDE_SUB_TOKEN_<LABEL>.
[[durable_objects.bindings]]
name = "CLAUDE_SUB_POOL"
class_name = "ClaudeSubPool"

[vars]
CLAUDE_SUB_MAX_CONCURRENT = "4"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FactorySandbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ClaudeSubPool"]

[[containers]]
class_name = "FactorySandbox"
name = "ticks-factory-sandbox-staging"
scheduling_policy = "durable_object"

[containers.images.factory]
dockerfile = "./Dockerfile"
build_context = "../../image"
