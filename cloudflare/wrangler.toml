# Ticks factory worker.
#
# Self-deployed into the user's own Cloudflare account (D16): ticks.sh never
# operates the factory, and this bundle never imports from or deploys with
# cloud/worker. See docs/design/cloud-factory.md.
name = "ticks-factory"
main = "src/index.ts"
# Current at merge time. DO SQLite storage and current WebSocket hibernation
# ergonomics both need a recent date (cloud/worker is pinned at 2024-04-03 and
# is deliberately left alone).
compatibility_date = "2026-08-11"
# durable_object_io_tasks_prevent_eviction: a Durable Object with pending
# I/O (an open fetch to its container, a pending stream read) is not evicted
# for inactivity — the platform keep-alive the durable_object scheduling
# policy relies on (epic umq). Harmless on the current 0.x Sandbox path.
compatibility_flags = ["nodejs_compat", "durable_object_io_tasks_prevent_eviction"]

# Workers Logs (operator decision 2026-10-08): keep the factory's console output
# and unhandled exceptions, so a 500 is diagnosable after the fact. The run feed
# once answered Cloudflare's HTML 500 page and nothing recorded why (#261).
[observability]
enabled = true
head_sampling_rate = 1

# One RunRoom per project (idFromName(project)) — the dispatch lease is per
# project, so an epic-scoped room would hand every run its own lease and
# arbitrate nothing (D4, D19). It owns the lease, the pending-question store and
# the run_event fan-out to the board (tick bne); reconcile alarms land later.
[[durable_objects.bindings]]
name = "RUN_ROOMS"
class_name = "RunRoom"

[[migrations]]
tag = "v1"
# SQLite-backed storage — requires the recent compatibility_date above.
new_sqlite_classes = ["RunRoom"]

# One RepoRoom per repository (idFromName("owner/name")) — the repository
# Durable Object (tick ef7, SPEC §12 Phase 4 item 3): ONE publish slot with
# RunRoom's lease semantics and ONE serialized publisher, so every publish
# to a repository goes through a single writer and two concurrent runs of
# the same epic cannot both write. A lock, not a store — every fact it
# acts on is read from `.ticfac/` and the tracker.
[[durable_objects.bindings]]
name = "REPO_ROOMS"
class_name = "RepoRoom"

# One SignalInbox per project (idFromName(project)) — the funnel a signal
# becomes a tick through (tick 8sm). Per project rather than per source,
# because what has to be serialised is writes to ONE project's `.tick/`: two
# sources delivering at once are exactly the collision this object exists to
# order. It owns the in-memory commit queue and the (source, external_ref)
# dedup index; the commit itself is GitHub's contents API (src/tracker-write.ts).
[[durable_objects.bindings]]
name = "SIGNAL_INBOXES"
class_name = "SignalInbox"

# The orchestrator sandbox a run boots (the image context, at image/ since
# SPEC §12 Phase 4 item 4). The binding is
# a Durable Object binding because that is what a container IS on this platform:
# one Durable Object per container, addressed by name, whose class is the
# Sandbox SDK's — re-exported from src/index.ts and put behind the seam in
# src/sandbox.ts. Without this block the control plane refuses every run, which
# is exactly what a deployment that "only" forgot to declare a container looks
# like from the outside.
[[durable_objects.bindings]]
name = "SANDBOXES"
class_name = "Sandbox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SignalInbox"]

# RepoRoom's migration lives here, away from its binding above, because
# wrangler applies migrations in FILE ORDER and continues after the last tag
# the deployed worker has already applied. Declared next to its binding —
# between v1 and v2, where it reads best — a worker already at v3 sees nothing
# after v3, so this migration never runs and the API then refuses the binding
# for a class it was never told to create:
#
#   Cannot create binding for class 'RepoRoom' because it is not currently
#   configured to implement Durable Objects [code: 10061]
#
# Tags must ascend down the file. Keep new migrations at the bottom.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RepoRoom"]

# FactorySandbox (epic umq, tick nmd): the durable_object-policy container
# class. At the bottom, for the reason above.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["FactorySandbox"]

# The container application the Sandbox class runs. `image` is a path to the
# Dockerfile of the image context (ticfac/image — SPEC §12 Phase 4 item 4
# moved it there from cloud/sandbox), relative to this bundle's directory
# (ticfac/cloudflare — SPEC §12 Phase 4 item 1 moved the bundle there).
# `ticfac factory deploy` stages that tree so the same relative path is
# true in this repository and in the staged copy. Wrangler builds it and pushes it to
# the operator's own managed registry before it uploads the Worker (D16 — the
# factory runs in the operator's account or not at all), so a deploy without a
# working Docker is a stop, not a Worker that refuses every run.
# The factory's own container class on the `durable_object` scheduling policy
# (epic umq, ticks nmd and dax): src/factory-sandbox.ts. It is the ONLY
# container application now. The 0.x `Sandbox` class's application
# (`ticks-orchestrator`: one image per application, rolled out
# application-wide by every deploy) is gone — tick dax deleted its
# configuration along with the rollout machinery it required (the
# `rollout_active_grace_period` that kept a rollout off a live run's
# containers, and the deploy's rollout wait), and the deploy removes the
# application from the account once no run submitted before the cutover is
# still live. The SANDBOXES binding above and the class stay: pre-cutover run
# records route there (a run never straddles the two namespaces; tick 1hq),
# and the Durable Object migration history cannot be unwound.
#
# What the policy gives: a running container keeps the image it STARTED on
# through every later deploy (no application-wide rollout exists to take it),
# the class picks the image and the instance size per start, and there is no
# `max_instances` — the policy refuses one, so container-capacity.ts's count
# is the only cap.

[[durable_objects.bindings]]
name = "SANDBOXES_V1"
class_name = "FactorySandbox"

[[containers]]
class_name = "FactorySandbox"
name = "ticks-factory-sandbox"
scheduling_policy = "durable_object"

# The image a FactorySandbox starts on unless the run pinned another
# (`ctx.container.images.factory`). The image context `ticfac factory deploy`
# stages beside this bundle — the same tree the deleted 0.x application's
# `image` path used to name.
[containers.images.factory]
dockerfile = "../image/Dockerfile"

# One WorkerAgent per cloud worker attempt (epic 43y, ticks xd3 and hxd,
# src/worker-agent.ts): the attempt's pi-durable conversation in this
# object's own SQLite, its tools in the attempt's container — FactorySandbox
# on the do_v1 substrate, the 0.x Sandbox behind the harness door on the
# default sdk0 — its watch/steer WebSockets. Every worker of every run is
# one.
[[durable_objects.bindings]]
name = "WORKER_AGENTS"
class_name = "WorkerAgent"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["WorkerAgent"]

# The one claude subscription pool (tick 6fv, src/claude-sub.ts): per-
# subscription concurrency leases and quota benches for the claude-sub rung
# — a cloud job on the subscription (claude on a versionless alias) leases
# one subscription here at dispatch, and every answer the proxy sees is
# reported to this pool. The TOKENS are Worker secrets the operator sets,
# one per subscription:
#
#   wrangler secret put CLAUDE_SUB_TOKEN_MAX1   # from `claude setup-token`
#
# Nothing committed here names a value; /api/claude-sub and /api/deployment
# report the LABELS only. With no token secret set the pool exists but has
# no subscription, every lease answers `none`, and every claude-sub job
# falls back to the Workers AI ladder — the rung is OFF until the operator
# puts a token on, which is the design: nothing runs on the subscription
# nobody granted.
[[durable_objects.bindings]]
name = "CLAUDE_SUB_POOL"
class_name = "ClaudeSubPool"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ClaudeSubPool"]

# The Worker version this code is running as (its id, tag and upload time),
# so GET /api/deployment can say which version the factory actually serves —
# the one fact the D1 deployment record cannot hold, because wrangler assigns
# it after the record is written.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Run artifacts: runs/<project>/<run_id>/{run.json, artifacts/<tick_id>/...}
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "ticks-factory-artifacts"

# Signals, dispatch log, run index. Feature tables land with the phases that
# need them; migrations/ holds the deployment bookkeeping that exists today.
# `tk factory deploy` rewrites database_id in its own staged copy of this file
# with the operator's database; the placeholder committed here keeps local dev
# and the test harness working.
[[d1_databases]]
binding = "DB"
database_name = "ticks-factory"
database_id = "00000000-0000-0000-0000-000000000000"
# `tk factory deploy` runs `wrangler d1 migrations apply` against this directory
# before it deploys the bundle. Stated explicitly rather than left to wrangler's
# default so the deploy command and the config name the same path.
migrations_dir = "migrations"

# How long a submission refused by a live lease stays parked before it expires
# (D22): a queue that silently ignites work hours later is worse than a
# refusal, so the window is short, visible to `status`, and a deployment
# decision. Bounds and the default live in src/runs.ts.
[vars]
RUN_QUEUE_TTL_MS = "1800000"

# How long a signal's tick commit waits between attempts (tick 8sm). The
# contents API is a compare-and-swap on the branch ref, so a cloud run pushing
# tracker state at the same moment costs a signal a 409 and a retry, never a
# lost update. Bounds and the default live in src/signal-inbox.ts.
SIGNAL_COMMIT_RETRY_MS = "250"

# The label a maintainer applies to a GitHub issue to say "this one is for the
# machine" (tick vuz, D7). The label IS the consent boundary: an issue without
# it is not a signal however it is worded, and removing it stops future
# ingestion, because the label on the issue is the whole of that state.
#
# Stated here rather than left to the code's default so the deployable config
# says which word a maintainer has to type. A repository that already uses `tk`
# for something else renames it here and re-labels; nothing else moves.
#
# The webhook's shared secret is NOT here and never will be: it is a Worker
# secret (`wrangler secret put GITHUB_WEBHOOK_SECRET`), and a deployment
# without one ingests nothing rather than trusting an unsigned POST.
GITHUB_CONSENT_LABEL = "tk"

# Generic webhook sources (tick 0vb) have NO entry here at all, and that is the
# design rather than an omission. WHICH sources exist is the repository's
# decision, declared in its own tracked `.tick/runners.toml` as
# `[signals.sources.<name>]`; this deployment only has to hold the shared
# secret each declaration names, as a Worker secret:
#
#   wrangler secret put SIGNAL_SECRET_SENTRY
#
# The declaration names the BINDING, never the value — `runners.toml` is
# tracked and usually public. A declared source whose secret this deployment
# does not hold answers 503 and ingests nothing, exactly as an unconfigured
# GitHub webhook does.

# Which providers the gateway will route. Left unset on purpose: the default is
# `workers-ai` alone, the one rung billed to the operator's own Cloudflare
# account instead of by a vendor in cash, so no edit to a model id can quietly
# move a run's spend onto a card. A deployment that wants a BYOK rung names it
# here and redeploys — a stored key is not an opt-in.
#
#   GATEWAY_ALLOWED_PROVIDERS = "anthropic"
#
# `jev` — the classifier route (tick x0k; tick tum) — needs no opt-in: Jev is
# served by Workers AI (typesafe/jev) on the same account and billed like the
# `workers-ai` rung, and the Worker runs it with the CLOUDFLARE_API_TOKEN
# secret it already holds. There is no TypeSafe key.

# Budget enforcement lives in the Run Workflow, never in a prompt (D14): a model
# can be talked out of a budget, a Workflow step cannot. Both numbers are
# deployment decisions, and exhausting either is the SAME clean stop the
# operator's `tk cloud stop` takes — the in-flight work gets its grace window,
# the container is killed, and the run ends (D15; tick dl8 removed the
# closeout boot that used to follow: `ticfac run-epic` commits and pushes as
# it goes, so the branch is the state a new run re-derives from). Bounds and
# defaults live in src/run-workflow.ts.
#
# Deliberately small until a run has been measured with working enforcement. The
# first uncapped run billed $49.80 against a $25 ceiling because the cost query
# stopped after one page (see cts); a runaway under these numbers costs single
# digits. Raise them once a measured run shows what real work actually costs.
#
# The wall clock is that raise, and the measurement asked for it (tick 5fg).
# Forty-five minutes could not hold ONE tick: y45 recorded a complete one-tick
# epic at 78 minutes on `deepseek-v4-pro`, and per-tick containers then ran
# *flash*, which takes more steps. A run submitted with `--max-wall-clock 90m`
# was silently clamped to 45 here and its three workers were killed at ~29
# minutes with 393+ model calls each and nothing committed. Four hours holds a
# couple of batches of real ticks plus orchestration; the COST ceiling below is
# unchanged and remains the bound that protects the money.
#
# Raised again 2026-09-28 after the first ticfac epic run in the cloud (hn6: 9
# ticks, ~1h per tick on GLM-class workers) could not fit four hours, and the
# operator's rule for Workers AI spend is not to cap it: both are now runaway
# guards, not budgets. Liveness is judged by activity (wv2), not by this clock.
# The supervisor's look budget is DERIVED from this number (lookBudget in
# src/run-workflow.ts) and its cadence paced to reach it: a fixed 80 looks
# (~6h) killed hn6's healthy cloud run a quarter of the way into this clock.
RUN_MAX_WALL_CLOCK_MS = "86400000"
RUN_MAX_COST_USD = "250"
# How long the in-flight work has to land before a clean stop kills the
# orchestrator. Nothing durable is lost either way — tracker state is committed
# to the run branch — but a tick that is one commit from done deserves it.
RUN_STOP_GRACE_MS = "300000"

# The account's container ceiling: the most containers this factory runs at
# once. Every container counts here — each run's orchestrator AND each of its
# per-tick worker containers (the dispatch door's). 12 is sized as the
# orchestrator + a full wave (max_parallel 4) + the overlap a reboot creates
# (the replacement is addressed before the dead one is destroyed) + a second
# concurrent run (operator decision, 2026-09-30, after hn6's cloud run filled
# a ceiling of 3 with its orchestrator and two workers).
#
# On the durable_object scheduling policy this is a SELF-IMPOSED ceiling, not
# a platform one: the policy refuses a `[[containers]] max_instances`, so
# container-capacity.ts's count is the only cap, and the door answers
# `503 no_capacity` rather than start past it. It is declared here (and not in
# code) so raising it is a deployment decision bounded by the account's real
# container limits — about 750 standard-3 instances by vCPU (1,500 vCPU / 6
# TiB / 30 TB per account), shared with the operator's other container apps —
# rather than a code change. The suite pins this number to the Worker's
# compiled fallback, so the two cannot drift apart (tick 7fl's rule, kept
# where its subject moved).
FACTORY_MAX_INSTANCES = "12"

# Which harness and model the cloud runs (tick 1cd added the vars; tick uqi
# pinned them). The built-in defaults live in `src/worker-boot.ts`
# (`WORKER_DEFAULT_HARNESS` = `pi-durable`, `WORKER_DEFAULT_MODEL` =
# `workers-ai/@cf/zai-org/glm-5.3`) so an unconfigured deployment still boots
# a worker that can reach the gateway — the repository's own
# `[roles.implement]` routes to a vendor a cloud container has no credential
# for, and this gateway serves Workers AI only (tick ys3). What these vars
# buy is that the choice is no longer a SOURCE EDIT: before them, changing
# the worker model meant editing TypeScript and redeploying the factory.
#
# OPERATOR (ticks uqi, nwn; epic 43y tick jhp; epic ex6 tick 8gd): the cloud
# runs Workers AI models only — nothing in the cloud runs claude. Every
# factory worker is HOSTED (epic 43y): its conversation runs in the factory's
# WorkerAgent on pi-durable and its tools run in the container via the
# --boot/--finish halves, so a worker container's harness kind is pi-durable
# and the pi CLI is deleted from the image. Since tick 8gd the review is
# hosted the same way — its conversation is a WorkerAgent's, and the review
# container runs only the review's --boot/--finish halves — so the review
# routes to the same standing worker harness below and the model may change,
# the rule does not.
#
# RUN_HARNESS is deliberately UNSET here, and the reason is the review's
# ladder: a review's first rung is this var, and pinning it (as this config
# once pinned `omp`) would hold the review on that CLI no matter what the
# worker route says — the review would never reach its hosted kind. Unset,
# the review falls through to RUN_WORKER_HARNESS (pi-durable, hosted) and the
# orchestrator container, which needs no harness pin at all (its job is
# `ticfac run-epic`, and its entrypoint probes default to omp), runs exactly
# as it did. A deployment that wants the review on a CLI harness — or on the
# claude-sub rung, claude on a versionless alias — pins RUN_HARNESS itself;
# that pin is the review's first rung and the orchestrator's probe harness.
#
# Pinned explicitly below
# rather than left to the built-in default, so the deployable config says
# the rule and no silent default change can decide it: an unset RUN_MODEL
# would let the orchestrator container fall back to the repository's
# role/tier routing (the LOCAL worker CLI's route, not one this gateway
# serves), and an unset RUN_WORKER_MODEL would leave the workers to the TS
# constants.
#
# Order is run submission (`--model`/RUN_MODEL) > this var > the built-in
# default. Route a wave of cheap ticks to GLM 5.3 Flash with RUN_WORKER_MODEL:
#
#   RUN_WORKER_MODEL = "workers-ai/@cf/zai-org/glm-5.3-flash"

RUN_MODEL = "workers-ai/@cf/zai-org/glm-5.3"
RUN_WORKER_HARNESS = "pi-durable"
RUN_WORKER_MODEL = "workers-ai/@cf/zai-org/glm-5.3"

# The claude-sub rung (tick 6fv, spike jvj): how many jobs ONE subscription
# may hold at once. Not a platform limit — 4 parallel ran clean on staging —
# but a quota budget: at roughly 1–2% of the 5-hour window per opus review,
# 2 at a time cannot drain the window before the operator notices, and it
# leaves their own interactive use headroom. Each subscription gets the
# same cap; more subscriptions (more CLAUDE_SUB_TOKEN_<LABEL> secrets) add
# capacity, not per-subscription spend.
#
# The rung is OFF until a config selects it: this deployment's pins above
# name Workers AI pairings, and the run-submission/deployment ladder keeps
# them. A config that selects claude-sub names the versionless aliases —
# claude on `sonnet` or `opus` (implement sonnet → opus, review/closeout on
# opus) — never a pinned model id, which bills per token and is refused at
# routing. A claude-sub job that finds no free subscription (busy, or every
# one benched on its quota) falls back to the Workers AI ladder for that
# job; it never waits.
CLAUDE_SUB_MAX_CONCURRENT = "4"

# What a CLASSIFIED work type costs on this deployment (tick mrn, epic wne):
# which model serves each kind of work. The vocabulary — mechanical,
# translation, construction, diagnosis, design, on the axis of how much of
# the work is working out what to do rather than doing it — is the
# REPOSITORY's, closed in internal/runconfig; this table is the FACTORY's,
# the same kind of fact as RUN_WORKER_MODEL above and SWEEP_MAX_TIER below,
# because the factory owns the gateway and a repository cannot name a model
# it does not serve.
#
# The two documents are deliberately separable, which is the whole point: a
# classification records a WORK TYPE, never a model, so re-tuning this table —
# swapping the lineup, changing your mind about flash — cannot invalidate a
# recorded classification. "This is a docs tick" stays true; "this deserves
# flash" was only ever true against one lineup.
#
# One `worktype=model` pair per entry, comma-separated. A work type with no
# mapping here falls back to the deployment's default (the run-submission >
# RUN_WORKER_MODEL > built-in-default chain) AND SAYS SO in the dispatch's
# own record — failing a dispatch on a table someone forgot to extend is the
# wrong failure. A key outside the five is refused by the closed enum, never
# silently ignored.
#
# With today's two models (the spellings the repository's own routing pins,
# .tick/runners.toml [roles.implement]): cheap work is glm-5.3-flash, dear
# work is glm-5.3. `construction` is deliberately the contentious one — the
# boundary case, where the failure ladder earns its keep rather than where
# classification has to be right.
RUN_WORKER_MODEL_BY_WORK_TYPE = "mechanical=cloudflare-workers-ai/@cf/zai-org/glm-5.3-flash,translation=cloudflare-workers-ai/@cf/zai-org/glm-5.3-flash,construction=cloudflare-workers-ai/@cf/zai-org/glm-5.3-flash,diagnosis=cloudflare-workers-ai/@cf/zai-org/glm-5.3,design=cloudflare-workers-ai/@cf/zai-org/glm-5.3"

# Where a run's live `run_event` stream is forwarded so a board can draw it
# (tick bne). Left unset on purpose: a factory is self-deployed into the
# operator's own account and runs identically with no board — the stream is
# observability, never authority, so an unconfigured board costs a run nothing
# and a board that is down costs it nothing either. A deployment that wants a
# live board sets the base URL here and puts the credential in a secret
# (`wrangler secret put BOARD_TOKEN`), never in this tracked file.
#
#   BOARD_BASE_URL = "https://<your-board-host>"

# What a declared sweep policy is CLAMPED to. Every one of these is reported in
# the sweep's record beside the number the repository asked for (tick 7zk: an
# operator whose $40 silently became $8 found out from the cancellation).
#
# The cost ceiling is deliberately absent: it is RUN_MAX_COST_USD above,
# because a sweep is a run and a second cost ceiling that could disagree with
# the enforcing one is exactly the layering tick 5fg had to enumerate by hand.
SWEEP_MAX_TICKS = "5"
SWEEP_MAX_TIER = "economy"
SWEEP_MAX_PROJECTS = "4"

# Cron sweeps (D14/D15, tick hye): when the factory WAKES to look for work.
#
# Two decisions, deliberately split. This is the deployment's: the minutes at
# which the Worker's `scheduled` handler runs at all. WHICH sweeps are due at
# one of those minutes is the repository's, declared in its own tracked
# `.tick/runners.toml`:
#
#   [sweeps.morning-bugs]
#   cron = "0 4 * * 1-5"
#   filter = "type:bug priority<=2 unblocked"
#   max_ticks = 5
#   budget_usd = 10
#   tier = "economy"
#   gate_on_complete = "telegram"
#
# So an operator controls when unattended work may start and a repository
# controls what it is, and neither can be widened by anything a run says. A
# repository declaring a minute this deployment never wakes for simply never
# fires — add the minute here.
#
# Hourly on the hour is the default because it is the coarsest schedule that
# can serve an `0 4 * * 1-5` policy; every wake-up with no due sweep costs one
# `.tick/runners.toml` read per enrolled project and nothing else.
#
# One of those wake-ups a day also builds the loop digest (tick zaw), which is
# the only thing that ASKS whether the unattended loops are still working: a
# sweep refusing every morning and a review run that never comments both stop
# quietly otherwise. It rides this trigger rather than declaring a second one,
# at `DIGEST_HOUR` (default 07:00 UTC), and sends nothing on the days it has
# nothing to say. A deployment that changes DIGEST_HOUR must keep it an hour
# these crons actually cover.
[triggers]
crons = ["0 * * * *"]

# The Run Workflow: one instance per run, keyed by run id, so one trace ID
# threads every layer (D20) and `status` finds the instance with no extra
# column. src/runs.ts creates instances; src/run-workflow.ts is the lifecycle.
[[workflows]]
name = "ticks-run"
binding = "RUN_WORKFLOW"
class_name = "RunWorkflow"

[dev]
port = 8788
